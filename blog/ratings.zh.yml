# 评分标准：每个分数的含义。5 分是中点，代表一部合格的作品。
# 每个评论分类都可以在 categories 下覆盖任意字段；没有覆盖的部分使用下面的默认值。
subtitle: 5 分是基准线：一部合格的作品。
tiers:
  - score: 1
    name: 严重失败
    definition: 缺乏基本完整性或表达能力，几乎无法实现创作目标。
  - score: 2
    name: 失败
    definition: 大部分创作目标未能实现，仅有零星可取之处。
  - score: 3
    name: 较差
    definition: 叙事、结构或制作的多处缺陷妨碍作品成立。
  - score: 4
    name: 存在缺陷
    definition: 有可取之处，但核心表达或执行存在明显问题。
  - score: 5
    name: 合格
    definition: 完整、成立、制作匹配表达，但缺少突出的艺术成就。
  - score: 6
    name: 值得一看
    definition: 具备明确亮点和讨论价值，但存在显著遗憾。
  - score: 7
    name: 优秀
    definition: 创作意识鲜明，有巧思、有意境，整体令人信服。
  - score: 8
    name: 杰出
    definition: 在表达、形式、技艺或文化意义上有突出贡献。
  - score: 9
    name: 大师之作
    definition: 艺术成就极高，值得反复观看、研究与讨论。
  - score: 10
    name: 私人经典
    definition: 杰作与个人生命经验产生深刻共鸣，愿意接纳它的缺憾。
categories: []
